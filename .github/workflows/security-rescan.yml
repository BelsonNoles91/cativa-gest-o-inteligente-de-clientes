name: Security re-scan (migrations)

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/tests/**"
      - ".security-allowlist.json"
      - "scripts/security-rescan.mjs"
      - "scripts/e2e-db-target-check.mjs"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/tests/**"
  workflow_dispatch:

concurrency:
  group: security-rescan-qa-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  rescan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instala cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verifica secret do banco
        id: db-secret
        env:
          SUPABASE_QA_DB_URL: ${{ secrets.SUPABASE_QA_DB_URL }}
        run: |
          if [ -z "$SUPABASE_QA_DB_URL" ]; then
            echo "::warning::Secret SUPABASE_QA_DB_URL ausente — regressões SQL não executadas (registrado no resumo)."
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '## Testes de regressão de RLS\n\nNão executados: SUPABASE_QA_DB_URL não configurado.\n' > rls-summary.md
            printf '## Re-scan de segurança\n\nNão executado: SUPABASE_QA_DB_URL não configurado.\n' > security-report.md
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lista migrations alteradas
        id: migrations
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
            git fetch --no-tags --depth=200 origin "$BASE_REF"
          else
            BASE="$BEFORE_SHA"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- supabase/migrations supabase/functions || true)
          {
            echo "## Alterações de backend nesta mudança"
            echo ""
            if [ -z "$CHANGED" ]; then
              echo "Nenhuma migration ou edge function alterada."
            else
              printf '%s\n' "$CHANGED" | sed 's/^/- /'
            fi
            echo ""
          } > migrations-summary.md
          cat migrations-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verifica conexão com o banco QA (sem aplicar migrations)
        if: steps.db-secret.outputs.available == 'true'
        env:
          SUPABASE_QA_DB_URL: ${{ secrets.SUPABASE_QA_DB_URL }}
          E2E_QA_PROJECT_REF: ${{ secrets.E2E_QA_PROJECT_REF }}
          E2E_TARGET_ALLOWLIST: ${{ secrets.E2E_TARGET_ALLOWLIST }}
        run: |
          node scripts/e2e-db-target-check.mjs
          psql "$SUPABASE_QA_DB_URL" -X -q -c "select 1" > /dev/null
          echo "Conexão com o banco validada."

      - name: Testes de regressão de RLS e isolamento multi-tenant
        id: rls
        if: steps.db-secret.outputs.available == 'true'
        continue-on-error: true
        env:
          SUPABASE_QA_DB_URL: ${{ secrets.SUPABASE_QA_DB_URL }}
          E2E_QA_PROJECT_REF: ${{ secrets.E2E_QA_PROJECT_REF }}
          E2E_TARGET_ALLOWLIST: ${{ secrets.E2E_TARGET_ALLOWLIST }}
        run: |
          node scripts/e2e-db-target-check.mjs
          set -o pipefail
          : > rls-output.txt
          psql "$SUPABASE_QA_DB_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls-regression.sql 2>&1 | tee -a rls-output.txt
          psql "$SUPABASE_QA_DB_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/tenant-idor-regression.sql 2>&1 | tee -a rls-output.txt
          {
            echo "## Testes de regressão de RLS e isolamento multi-tenant"
            echo ""
            echo '```'
            grep -E 'NOTICE|WARNING|ERROR' rls-output.txt || cat rls-output.txt
            echo '```'
            echo ""
          } > rls-summary.md
          cat rls-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Registra falha dos testes de RLS
        if: steps.db-secret.outputs.available == 'true' && steps.rls.outcome == 'failure'
        run: |
          {
            echo "## Testes de regressão de RLS e isolamento multi-tenant"
            echo ""
            echo "❌ Os testes de RLS/IDOR falharam. Saída:"
            echo ""
            echo '```'
            tail -n 40 rls-output.txt 2>/dev/null || echo "sem saída"
            echo '```'
            echo ""
          } > rls-summary.md

      - name: Re-scan de segurança
        id: rescan
        if: steps.db-secret.outputs.available == 'true'
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_QA_DB_URL }}
          SUPABASE_QA_DB_URL: ${{ secrets.SUPABASE_QA_DB_URL }}
          E2E_QA_PROJECT_REF: ${{ secrets.E2E_QA_PROJECT_REF }}
          E2E_TARGET_ALLOWLIST: ${{ secrets.E2E_TARGET_ALLOWLIST }}
          SECURITY_SCAN_PR: ${{ github.event.pull_request.number }}
        run: |
          node scripts/e2e-db-target-check.mjs
          if [ -f migrations-summary.md ]; then
            SECURITY_SCAN_MIGRATIONS=$(grep -o 'supabase/[^`]*' migrations-summary.md | paste -sd, -)
            export SECURITY_SCAN_MIGRATIONS
          fi
          node scripts/security-rescan.mjs --out security-report.md

      - name: Monta comentário do PR
        if: github.event_name == 'pull_request'
        run: cat migrations-summary.md rls-summary.md security-report.md > pr-comment.md

      - name: Comenta resumo no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const marker = '<!-- security-rescan -->';
            const content = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: content });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: content });
            }

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            security-report.md
            migrations-summary.md
            rls-summary.md
            rls-output.txt

      - name: Falha se houver achados críticos ou regressão de RLS/IDOR
        if: steps.rescan.outcome == 'failure' || steps.rls.outcome == 'failure'
        run: |
          if [ "${{ steps.rls.outcome }}" = "failure" ]; then
            echo "::error::Testes de regressão de RLS/IDOR falharam."
          fi
          if [ "${{ steps.rescan.outcome }}" = "failure" ]; then
            echo "::error::Re-scan de segurança encontrou achados críticos."
          fi
          exit 1
