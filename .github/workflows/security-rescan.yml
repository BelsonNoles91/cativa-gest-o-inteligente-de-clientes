name: Security re-scan (migrations)

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".security-allowlist.json"
      - "scripts/security-rescan.mjs"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
  workflow_dispatch:

concurrency:
  group: security-rescan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instala cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verifica secret do banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL ausente — o re-scan de segurança não pode rodar."
            exit 1
          fi

      - name: Lista migrations alteradas
        id: migrations
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- supabase/migrations supabase/functions || true)
          {
            echo "## Alterações de backend nesta mudança"
            echo ""
            if [ -z "$CHANGED" ]; then
              echo "Nenhuma migration ou edge function alterada."
            else
              echo "$CHANGED" | sed 's/^/- `/; s/$/`/'
            fi
            echo ""
          } > migrations-summary.md
          cat migrations-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Aplica migrations pendentes (dry-run de verificação)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -X -q -c "select 1" > /dev/null
          echo "Conexão com o banco validada."

      - name: Testes de regressão de RLS
        id: rls
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls-regression.sql 2>&1 | tee rls-output.txt
          {
            echo "## Testes de regressão de RLS"
            echo ""
            echo '```'
            grep -E 'NOTICE|WARNING|ERROR' rls-output.txt || cat rls-output.txt
            echo '```'
            echo ""
          } > rls-summary.md
          cat rls-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Registra falha dos testes de RLS
        if: steps.rls.outcome == 'failure'
        run: |
          {
            echo "## Testes de regressão de RLS"
            echo ""
            echo "❌ Os testes de RLS falharam. Saída:"
            echo ""
            echo '```'
            tail -n 40 rls-output.txt 2>/dev/null || echo "sem saída"
            echo '```'
            echo ""
          } > rls-summary.md

      - name: Re-scan de segurança
        id: rescan
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SECURITY_SCAN_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -f migrations-summary.md ]; then
            SECURITY_SCAN_MIGRATIONS=$(grep -o 'supabase/[^`]*' migrations-summary.md | paste -sd, -)
            export SECURITY_SCAN_MIGRATIONS
          fi
          node scripts/security-rescan.mjs --out security-report.md

      - name: Monta comentário do PR
        if: github.event_name == 'pull_request'
        run: cat migrations-summary.md rls-summary.md security-report.md > pr-comment.md

      - name: Comenta resumo no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const marker = '<!-- security-rescan -->';
            const content = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: content });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: content });
            }

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.md
            migrations-summary.md
            rls-summary.md
            rls-output.txt

      - name: Falha se houver achados críticos ou regressão de RLS
        if: steps.rescan.outcome == 'failure' || steps.rls.outcome == 'failure'
        run: |
          if [ "${{ steps.rls.outcome }}" = "failure" ]; then
            echo "::error::Testes de regressão de RLS falharam."
          fi
          if [ "${{ steps.rescan.outcome }}" = "failure" ]; then
            echo "::error::Re-scan de segurança encontrou achados críticos."
          fi
          exit 1
