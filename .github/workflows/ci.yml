name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verifica guard de env vars ausentes
        run: npm run test:build:missing-env

  playwright-mobile:
    needs: vitest
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_USER: ${{ secrets.E2E_USER }}
      E2E_PASS: ${{ secrets.E2E_PASS }}
      E2E_SEED_FIXTURES: "true"
      E2E_TENANT_SLUG: studio-teste-qa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Identifica alvo Supabase dos testes
        run: node scripts/e2e-target-check.mjs

      - name: Visual regression — rotas públicas
        run: npm run test:visual:public

      - name: Visual regression — rotas autenticadas críticas
        run: npm run test:visual:auth:critical
        continue-on-error: ${{ !secrets.E2E_USER }}

  qa-authenticated:
    needs: vitest
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_USER: ${{ secrets.E2E_USER }}
      E2E_PASS: ${{ secrets.E2E_PASS }}
      E2E_SEED_FIXTURES: "true"
      E2E_TENANT_SLUG: studio-teste-qa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Identifica alvo Supabase dos testes
        run: node scripts/e2e-target-check.mjs

      - name: QA autenticado com dados reais de teste
        run: npm run test:qa:authenticated

  backend-integrity:
    needs: vitest
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_USER: ${{ secrets.E2E_USER }}
      E2E_PASS: ${{ secrets.E2E_PASS }}
      E2E_SEED_FIXTURES: "true"
      E2E_TENANT_SLUG: studio-teste-qa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Identifica alvo Supabase dos testes
        run: node scripts/e2e-target-check.mjs

      - name: Prepara fixtures reais de QA
        run: node scripts/e2e-seed-fixtures.mjs

      - name: Concorrência e integridade da agenda
        run: npm run test:backend:concurrency
