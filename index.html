<!doctype html>

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />

    <!-- Theme color (atualizado dinamicamente em modo escuro pelo ThemeProvider) -->
    <meta name="theme-color" content="#FAF7F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1015" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA / Installable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- iOS standalone "app" mode.
         black-translucent permite que a UI use a área sob o status bar
         (em conjunto com viewport-fit=cover + env(safe-area-inset-top)). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cativa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Cativa" />

    <!-- Disable phone-number autodetection on iOS -->
    <meta name="format-detection" content="telephone=no" />
